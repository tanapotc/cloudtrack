name: Deploy Azure dev

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - backend/**
      - frontend/**
      - .github/workflows/deploy-azure.yml

concurrency:
  group: deploy-azure-dev
  cancel-in-progress: false

permissions:
  id-token: write
  contents: read

jobs:
  deploy:
    if: vars.AZURE_DEPLOY_ENABLED == 'true'
    runs-on: ubuntu-latest
    environment: azure-dev
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 8.0.x

      - name: Build Angular application
        run: |
          npm ci --prefix frontend
          npm run build --prefix frontend

      - name: Publish App Service package
        shell: bash
        run: |
          dotnet publish backend/src/CloudTrack.Api/CloudTrack.Api.csproj \
            --configuration Release \
            --output "$RUNNER_TEMP/cloudtrack-publish" \
            -p:IncludeFrontendDist=true
          cd "$RUNNER_TEMP/cloudtrack-publish"
          zip -q -r "$RUNNER_TEMP/cloudtrack.zip" .

      - name: Sign in to Azure with GitHub OIDC
        uses: azure/login@v2
        with:
          client-id: ${{ vars.AZURE_CLIENT_ID }}
          tenant-id: ${{ vars.AZURE_TENANT_ID }}
          subscription-id: ${{ vars.AZURE_SUBSCRIPTION_ID }}

      - name: Deploy ZIP package to App Service
        run: >-
          az webapp deploy
          --resource-group "${{ vars.AZURE_RESOURCE_GROUP }}"
          --name "${{ vars.AZURE_WEB_APP }}"
          --src-path "$RUNNER_TEMP/cloudtrack.zip"
          --type zip
          --output none

      - name: Verify public authentication routes
        shell: bash
        run: |
          hostname=$(az webapp show \
            --resource-group "${{ vars.AZURE_RESOURCE_GROUP }}" \
            --name "${{ vars.AZURE_WEB_APP }}" \
            --query defaultHostName -o tsv)
          for path in health auth/login auth/register auth/forgot-password; do
            curl --fail --silent --show-error \
              --retry 12 --retry-delay 10 --retry-all-errors \
              "https://$hostname/$path" > /dev/null
          done
