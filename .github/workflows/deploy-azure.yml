name: Deploy Azure dev

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - backend/**
      - frontend/**
      - infra/**
      - Dockerfile

permissions:
  id-token: write
  contents: read

jobs:
  deploy:
    if: vars.AZURE_DEPLOY_ENABLED == 'true'
    runs-on: ubuntu-latest
    environment: azure-dev
    steps:
      - uses: actions/checkout@v4
      - uses: azure/login@v2
        with:
          client-id: ${{ secrets.AZURE_CLIENT_ID }}
          tenant-id: ${{ secrets.AZURE_TENANT_ID }}
          subscription-id: ${{ secrets.AZURE_SUBSCRIPTION_ID }}
      - name: Deploy infrastructure
        uses: azure/arm-deploy@v2
        with:
          scope: resourcegroup
          resourceGroupName: ${{ vars.AZURE_RESOURCE_GROUP }}
          template: infra/main.bicep
          parameters: >-
            postgresAdminLogin=${{ secrets.POSTGRES_ADMIN_LOGIN }}
            postgresAdminPassword=${{ secrets.POSTGRES_ADMIN_PASSWORD }}
            jwtSigningKey=${{ secrets.JWT_SIGNING_KEY }}
            seedAdminEmail=${{ secrets.SEED_ADMIN_EMAIL }}
            seedAdminPassword=${{ secrets.SEED_ADMIN_PASSWORD }}
          failOnStdErr: false
      - name: Build image in Azure Container Registry
        shell: bash
        run: |
          registry=$(az deployment group show --resource-group "${{ vars.AZURE_RESOURCE_GROUP }}" --name cloudtrack-dev --query properties.outputs.registryName.value -o tsv)
          az acr build --registry "$registry" --image "cloudtrack:${GITHUB_SHA}" .
          app=$(az deployment group show --resource-group "${{ vars.AZURE_RESOURCE_GROUP }}" --name cloudtrack-dev --query properties.outputs.containerAppName.value -o tsv)
          server=$(az acr show --name "$registry" --query loginServer -o tsv)
          az containerapp update --resource-group "${{ vars.AZURE_RESOURCE_GROUP }}" --name "$app" --image "$server/cloudtrack:${GITHUB_SHA}"

