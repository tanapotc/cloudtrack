name: CI

on:
  workflow_dispatch:
  pull_request:
  push:
    branches: [main]

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  backend:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 8.0.x
      - name: Start ephemeral SQL Server
        run: bash .github/scripts/start-sql-server.sh
      - run: dotnet tool restore
      - run: dotnet restore backend/CloudTrack.sln
      - run: dotnet build backend/CloudTrack.sln --configuration Release --no-restore
        env:
          Jwt__SigningKey: ci-build-only-signing-key-with-32-characters
      - run: dotnet test backend/CloudTrack.sln --configuration Release --no-build --collect:"XPlat Code Coverage"
        env:
          Jwt__SigningKey: ci-test-only-signing-key-with-32-characters
      - name: Verify migrations match the model
        run: >-
          dotnet ef migrations has-pending-model-changes
          --project backend/src/CloudTrack.Infrastructure
          --startup-project backend/src/CloudTrack.Infrastructure

  frontend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - run: npm ci
      - run: npm test -- --watch=false
      - run: npm run build
      - run: npx prettier --check "src/**/*.{ts,html,scss}" "e2e/**/*.ts" angular.json
      - run: npm audit --omit=dev
      - run: npx playwright install --with-deps chromium
      - name: Start ephemeral SQL Server
        run: bash ../.github/scripts/start-sql-server.sh
      - run: npm run e2e

  secret-scan:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: gitleaks/gitleaks-action@v2

  container:
    if: github.event_name == 'push'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-buildx-action@v3
      - uses: docker/build-push-action@v6
        with:
          context: .
          push: false
          tags: cloudtrack:${{ github.sha }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
