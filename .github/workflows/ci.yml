name: CI

on:
  workflow_dispatch:
  pull_request:
  push:
    branches: [main]

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  backend:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 8.0.x
      - run: dotnet tool restore
      - run: dotnet restore backend/CloudTrack.sln
      - run: dotnet build backend/CloudTrack.sln --configuration Release --no-restore
        env:
          Jwt__SigningKey: ci-build-only-signing-key-with-32-characters
      - name: Run domain unit tests
        run: dotnet test backend/tests/CloudTrack.UnitTests/CloudTrack.UnitTests.csproj --configuration Release --no-build --collect:"XPlat Code Coverage"
        env:
          Jwt__SigningKey: ci-test-only-signing-key-with-32-characters
      - name: Verify migrations match the model
        run: >-
          dotnet ef migrations has-pending-model-changes
          --project backend/src/CloudTrack.Infrastructure
          --startup-project backend/src/CloudTrack.Infrastructure
      - name: Verify the committed OpenAPI spec matches the API
        run: |
          dotnet tool run swagger tofile --output frontend/openapi/cloudtrack.json \
            backend/src/CloudTrack.Api/bin/Release/net8.0/CloudTrack.Api.dll v1
          git diff --exit-code -- frontend/openapi/cloudtrack.json
        env:
          Jwt__SigningKey: ci-swagger-export-key-with-32-characters

  frontend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - run: npm ci
      - name: Verify the generated API client is current
        run: |
          npm run api-generate
          git diff --exit-code -- src/app/api
      - run: npm test -- --watch=false
      - run: npm run build
      - run: npx prettier --check "src/**/*.{ts,html,scss}" "e2e/**/*.ts" angular.json
      - run: npm audit --omit=dev

  secret-scan:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: gitleaks/gitleaks-action@v2
