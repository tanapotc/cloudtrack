name: cloudtrack

services:
  app:
    build:
      context: .
      dockerfile: Dockerfile
    environment:
      ASPNETCORE_ENVIRONMENT: Development
      Database__Provider: SqlServer
      ConnectionStrings__DefaultConnection: Server=database,1433;Initial Catalog=cloudtrack;User ID=sa;Password=${MSSQL_SA_PASSWORD};Encrypt=False;TrustServerCertificate=True
      Jwt__SigningKey: ${JWT__SIGNINGKEY}
      Seed__AdminEmail: ${SEED__ADMINEMAIL}
      Seed__AdminPassword: ${SEED__ADMINPASSWORD}
      Auth__ExposeDevelopmentResetToken: "true"
    ports:
      - "8080:8080"
    depends_on:
      database:
        condition: service_healthy

  database:
    image: mcr.microsoft.com/mssql/server:2022-latest
    environment:
      ACCEPT_EULA: "Y"
      MSSQL_SA_PASSWORD: ${MSSQL_SA_PASSWORD}
    volumes:
      - cloudtrack-data:/var/opt/mssql
    healthcheck:
      test: ["CMD-SHELL", "/opt/mssql-tools18/bin/sqlcmd -S localhost -U sa -P \"$${MSSQL_SA_PASSWORD}\" -C -Q \"SELECT 1\" || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 15

volumes:
  cloudtrack-data:
