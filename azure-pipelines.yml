trigger:
  branches:
    include:
      - main

pr:
  branches:
    include:
      - main

variables:
  BuildConfiguration: Release
  # Keep Azure deployment opt-in. Override this in the Azure DevOps pipeline UI only
  # after the service connection and target variables have been configured.
  AzureDeployEnabled: "false"

stages:
  - stage: Validate
    displayName: Build and test
    jobs:
      - job: Backend
        displayName: Backend build and unit tests
        pool:
          vmImage: ubuntu-latest
        steps:
          - checkout: self
            fetchDepth: 0
          - task: UseDotNet@2
            inputs:
              packageType: sdk
              version: 8.0.x
          - bash: |
              set -euo pipefail
              dotnet tool restore
              dotnet restore backend/CloudTrack.sln
              dotnet build backend/CloudTrack.sln --configuration "$(BuildConfiguration)" --no-restore
              dotnet test backend/tests/CloudTrack.UnitTests/CloudTrack.UnitTests.csproj --configuration "$(BuildConfiguration)" --no-build
            env:
              Jwt__SigningKey: ci-build-only-signing-key-with-32-characters
            displayName: Build and run unit tests
          - bash: |
              set -euo pipefail
              dotnet ef migrations has-pending-model-changes \
                --project backend/src/CloudTrack.Infrastructure \
                --startup-project backend/src/CloudTrack.Infrastructure
              dotnet tool run swagger tofile --output frontend/openapi/cloudtrack.json \
                backend/src/CloudTrack.Api/bin/Release/net8.0/CloudTrack.Api.dll v1
              git diff --exit-code -- frontend/openapi/cloudtrack.json
            env:
              Jwt__SigningKey: ci-swagger-export-key-with-32-characters
            displayName: Verify migrations and OpenAPI contract

      - job: Frontend
        displayName: Frontend build and tests
        pool:
          vmImage: ubuntu-latest
        steps:
          - checkout: self
          - task: NodeTool@0
            inputs:
              versionSpec: 24.x
          - bash: |
              set -euo pipefail
              npm ci --prefix frontend
              npm run api-generate --prefix frontend
              git diff --exit-code -- frontend/src/app/api
              npm test --prefix frontend -- --watch=false
              npm run build --prefix frontend
              npx --prefix frontend prettier --check "src/**/*.{ts,html,scss}" "e2e/**/*.ts" angular.json
              npm audit --prefix frontend --omit=dev
            displayName: Verify generated client, tests, build, formatting, and dependencies

      - job: Integration
        displayName: Backend integration tests
        dependsOn: Backend
        # SqlServerPassword must be a secret pipeline variable. With no variable,
        # this job is skipped instead of placing a database credential in Git.
        condition: and(succeeded(), ne(variables['SqlServerPassword'], ''))
        pool:
          vmImage: ubuntu-latest
        services:
          sqlserver:
            image: mcr.microsoft.com/mssql/server:2022-latest
            env:
              ACCEPT_EULA: "Y"
              MSSQL_PID: Developer
              MSSQL_SA_PASSWORD: $(SqlServerPassword)
        steps:
          - checkout: self
          - task: UseDotNet@2
            inputs:
              packageType: sdk
              version: 8.0.x
          - bash: |
              set -euo pipefail
              for attempt in {1..30}; do
                if (echo > /dev/tcp/sqlserver/1433) >/dev/null 2>&1; then exit 0; fi
                sleep 2
              done
              echo "SQL Server test container did not accept connections in time."
              exit 1
            displayName: Wait for isolated SQL Server
          - bash: |
              set -euo pipefail
              dotnet restore backend/CloudTrack.sln
              dotnet test backend/tests/CloudTrack.IntegrationTests/CloudTrack.IntegrationTests.csproj \
                --configuration "$(BuildConfiguration)" --no-restore
            env:
              CLOUDTRACK_TEST_SQLSERVER: Server=sqlserver,1433;User ID=sa;Password=$(SqlServerPassword);Encrypt=False;TrustServerCertificate=True
            displayName: Run integration tests

  - stage: DeployAzureDev
    displayName: Deploy Azure development app
    dependsOn: Validate
    condition: and(succeeded(), eq(variables['Build.SourceBranch'], 'refs/heads/main'), eq(variables['AzureDeployEnabled'], 'true'))
    jobs:
      - job: Deploy
        displayName: Package and deploy App Service
        pool:
          vmImage: ubuntu-latest
        steps:
          - checkout: self
          - task: NodeTool@0
            inputs:
              versionSpec: 24.x
          - task: UseDotNet@2
            inputs:
              packageType: sdk
              version: 8.0.x
          - bash: |
              set -euo pipefail
              npm ci --prefix frontend
              npm run build --prefix frontend
              dotnet publish backend/src/CloudTrack.Api/CloudTrack.Api.csproj \
                --configuration "$(BuildConfiguration)" \
                --output "$(Build.ArtifactStagingDirectory)/publish" \
                -p:IncludeFrontendDist=true
            displayName: Build deployable package
          - task: ArchiveFiles@2
            inputs:
              rootFolderOrFile: $(Build.ArtifactStagingDirectory)/publish
              includeRootFolder: false
              archiveType: zip
              archiveFile: $(Build.ArtifactStagingDirectory)/cloudtrack.zip
              replaceExistingArchive: true
          - task: AzureCLI@2
            inputs:
              azureSubscription: $(AzureServiceConnection)
              scriptType: bash
              scriptLocation: inlineScript
              inlineScript: |
                set -euo pipefail
                az webapp deploy \
                  --resource-group "$(AzureResourceGroup)" \
                  --name "$(AzureWebAppName)" \
                  --src-path "$(Build.ArtifactStagingDirectory)/cloudtrack.zip" \
                  --type zip \
                  --output none
                host=$(az webapp show \
                  --resource-group "$(AzureResourceGroup)" \
                  --name "$(AzureWebAppName)" \
                  --query defaultHostName -o tsv)
                bash .github/scripts/smoke-azure.sh "https://$host"
            displayName: Deploy and smoke test
